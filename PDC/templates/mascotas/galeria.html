{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería</title>
  <link rel="stylesheet" href="{% static 'CSS/styles.css' %}">
</head>
<body>
  <h1>Galería de Imágenes</h1>
  <div class="galeria">
    {% for image in images %}
      <img src="{% static image %}" alt="Imagen de galería">
    {% endfor %}
  </div>
</body>
</html>
